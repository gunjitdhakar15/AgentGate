<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentGate — Live Firewall Dashboard</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121a22;
    --panel2: #0f1620;
    --line: #1f2a37;
    --text: #e6edf3;
    --muted: #8b98a5;
    --green: #34d399;
    --red: #f87171;
    --amber: #fbbf24;
    --blue: #38bdf8;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 18px;
    max-width: 1200px;
    margin: 0 auto;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; }
  .brand svg { flex: none; }
  .tag {
    font-size: 11px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: var(--blue);
    border: 1px solid var(--line); padding: 3px 8px; border-radius: 999px;
  }
  .live { display: flex; align-items: center; gap: 6px; color: var(--green); font-size: 12px; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% {opacity:1} 50% {opacity:.35} }
  .uptime { margin-left: auto; color: var(--muted); font-family: var(--mono); font-size: 12px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px; display: flex; flex-direction: column; gap: 4px;
  }
  .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .card .num { font-family: var(--mono); font-size: 30px; font-weight: 700; }
  .card.ok .num { color: var(--green); }
  .card.bad .num { color: var(--red); }
  .card.warn .num { color: var(--amber); }
  .card.sub .num { color: var(--blue); }

  .grid { display: grid; grid-template-columns: 300px 1fr; gap: 12px; margin-bottom: 18px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px;
  }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 12px; }

  .donut-wrap { display: flex; align-items: center; gap: 16px; }
  .donut-svg { width: 150px; height: 150px; flex: none; }
  .donut-svg circle { fill: none; stroke-width: 14; }
  .donut-bg { stroke: var(--panel2); }
  .donut-fg { stroke: var(--green); stroke-linecap: round; transition: stroke-dasharray .5s ease; }
  .legend { display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
  .legend .row { display: flex; align-items: center; gap: 8px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; }
  .sw.g { background: var(--green); } .sw.r { background: var(--red); }
  .legend .n { margin-left: auto; font-family: var(--mono); }

  .tool-row { display: grid; grid-template-columns: 110px 1fr 150px; align-items: center; gap: 12px; padding: 7px 0; }
  @media (max-width: 760px) { .tool-row { grid-template-columns: 80px 1fr; } .tool-row .tool-nums { grid-column: 2; } }
  .tool-name { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool-bar { height: 10px; border-radius: 5px; background: var(--panel2); overflow: hidden; display: flex; }
  .bar-ok { background: var(--green); height: 100%; transition: width .4s ease; }
  .bar-bad { background: var(--red); height: 100%; transition: width .4s ease; }
  .tool-nums { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
  .ok { color: var(--green); } .bad { color: var(--red); } .warn { color: var(--amber); }

  .feed { list-style: none; max-height: 420px; overflow-y: auto; font-family: var(--mono); font-size: 12px; }
  .feed::-webkit-scrollbar { width: 8px; }
  .feed::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  .row {
    display: grid; grid-template-columns: 80px 84px 110px 100px 1fr 70px; gap: 10px;
    padding: 6px 8px; border-bottom: 1px solid var(--panel2); align-items: center;
  }
  @media (max-width: 760px) { .row { grid-template-columns: 70px 70px 1fr; } .row .m, .row .dur { display: none; } }
  .row .t { color: var(--muted); }
  .k { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; }
  .row.request .k { color: var(--blue); }
  .row.response .k { color: var(--green); }
  .row.blocked .k { color: var(--red); }
  .row.redacted .k { color: var(--amber); }
  .row.protocol .k, .row.error .k { color: var(--red); }
  .row .d { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .dur { color: var(--muted); text-align: right; }
  .empty { color: var(--muted); padding: 10px 0; font-family: var(--mono); font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 2 4 5v6c0 5 3.4 9.6 8 11 4.6-1.4 8-6 8-11V5l-8-3Z" stroke="#38bdf8" stroke-width="1.6" stroke-linejoin="round"/>
    </svg>
    AgentGate <span class="tag">live firewall</span>
    <a href="/" style="font-size:12px;color:var(--muted);text-decoration:none">← home</a>
  </div>
  <div class="live"><span class="dot"></span>streaming</div>
  <div class="uptime">uptime <span id="uptime">0s</span> · started <span id="started">-</span></div>
</header>

<main>
  <section class="cards">
    <div class="card"><span class="label">Total requests</span><span class="num" id="c-total">0</span></div>
    <div class="card ok"><span class="label">Allowed</span><span class="num" id="c-allowed">0</span></div>
    <div class="card bad"><span class="label">Blocked</span><span class="num" id="c-blocked">0</span></div>
    <div class="card warn"><span class="label">Secrets redacted</span><span class="num" id="c-redacted">0</span></div>
    <div class="card sub"><span class="label">Protocol errors</span><span class="num" id="c-protocol">0</span></div>
  </section>

  <section class="grid">
    <div class="panel">
      <h2>Allow vs. block</h2>
      <div class="donut-wrap">
        <svg class="donut-svg" viewBox="0 0 120 120">
          <circle class="donut-bg" cx="60" cy="60" r="52"/>
          <circle class="donut-fg" id="donut-fg" cx="60" cy="60" r="52"
                  stroke-dasharray="0 326" transform="rotate(-90 60 60)"/>
        </svg>
        <div class="legend">
          <div class="row"><span class="swatch sw g"></span>allowed <span class="n ok" id="lg-allowed">0</span></div>
          <div class="row"><span class="swatch sw r"></span>blocked <span class="n bad" id="lg-blocked">0</span></div>
          <div class="row" style="margin-top:6px"><span>total</span><span class="n" id="lg-total">0</span></div>
        </div>
      </div>
    </div>
    <div class="panel">
      <h2>Per-tool calls</h2>
      <div id="tools"><div class="empty">No tool calls yet</div></div>
    </div>
  </section>

  <section class="panel">
    <h2>Live audit feed</h2>
    <ul class="feed" id="feed"></ul>
  </section>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
let state = { started: null, counters: {}, tools: {}, recent: [] };

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function fmtTime(t) {
  const d = new Date(t);
  return d.toLocaleTimeString([], { hour12: false });
}

function fmtUptime() {
  if (!state.started) return "0s";
  const s = Math.max(0, (Date.now() - new Date(state.started).getTime()) / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
  return (h ? h + "h " : "") + m + "m " + sec + "s";
}

function render() {
  const c = state.counters || {};
  $("c-total").textContent = c.total ?? 0;
  $("c-allowed").textContent = c.allowed ?? 0;
  $("c-blocked").textContent = c.blocked ?? 0;
  $("c-redacted").textContent = c.redacted ?? 0;
  $("c-protocol").textContent = c.protocolError ?? 0;
  $("lg-allowed").textContent = c.allowed ?? 0;
  $("lg-blocked").textContent = c.blocked ?? 0;
  $("lg-total").textContent = (c.allowed ?? 0) + (c.blocked ?? 0);

  renderDonut(c.allowed ?? 0, c.blocked ?? 0);
  renderTools(state.tools || {});
  renderFeed(state.recent || []);

  if (state.started) {
    $("uptime").textContent = fmtUptime();
    $("started").textContent = new Date(state.started).toLocaleString();
  }
}

function renderDonut(allowed, blocked) {
  const total = allowed + blocked;
  const r = 52, circ = 2 * Math.PI * r;
  const pct = total ? (allowed / total * 100) : 0;
  $("donut-fg").style.strokeDasharray = (circ * pct / 100) + " " + circ;
}

function renderTools(tools) {
  const list = Object.entries(tools)
    .sort((a, b) => (b[1].allowed + b[1].blocked) - (a[1].allowed + a[1].blocked));
  const el = $("tools");
  if (!list.length) { el.innerHTML = '<div class="empty">No tool calls yet</div>'; return; }
  el.innerHTML = list.map(([name, s]) => {
    const tot = s.allowed + s.blocked;
    const ap = tot ? (s.allowed / tot * 100) : 0;
    return '<div class="tool-row">'
      + '<div class="tool-name" title="' + esc(name) + '">' + esc(name) + "</div>"
      + '<div class="tool-bar"><div class="bar-ok" style="width:' + ap + '%"></div>'
      + '<div class="bar-bad" style="width:' + (100 - ap) + '%"></div></div>'
      + '<div class="tool-nums"><span class="ok">' + s.allowed + " ok</span> · "
      + '<span class="bad">' + s.blocked + " blocked</span> · "
      + '<span class="warn">' + s.redacted + " redacted</span></div></div>";
  }).join("");
}

function renderFeed(items) {
  const el = $("feed");
  if (!items.length) { el.innerHTML = '<li class="empty">Waiting for traffic...</li>'; return; }
  el.innerHTML = items.slice().reverse().slice(0, 100).map(e => {
    const dur = e.duration_ns ? (e.duration_ns / 1e6).toFixed(0) + "ms" : "";
    return '<li class="row ' + esc(e.kind) + '">'
      + '<span class="t">' + esc(fmtTime(e.ts)) + "</span>"
      + '<span class="k">' + esc(e.kind) + "</span>"
      + '<span class="m">' + esc(e.method || "-") + "</span>"
      + '<span class="tool">' + esc(e.tool || "-") + "</span>"
      + '<span class="d">' + esc(e.decision || e.error || "") + "</span>"
      + '<span class="dur">' + dur + "</span></li>";
  }).join("");
}

function bumpTool(tool, field) {
  const tools = state.tools = state.tools || {};
  const t = tools[tool] = tools[tool] || { allowed: 0, blocked: 0, redacted: 0 };
  t[field] = (t[field] || 0) + 1;
}

function applyEntry(entry) {
  state.recent = [...(state.recent || []), entry].slice(-200);
  const c = state.counters = state.counters || {};
  if (entry.kind === "request") {
    c.total = (c.total || 0) + 1;
  } else if (entry.kind === "response" && entry.tool) {
    c.allowed = (c.allowed || 0) + 1;
    bumpTool(entry.tool, "allowed");
  } else if (entry.kind === "blocked") {
    c.blocked = (c.blocked || 0) + 1;
    if (entry.tool) bumpTool(entry.tool, "blocked");
  } else if (entry.kind === "redacted") {
    c.redacted = (c.redacted || 0) + 1;
    if (entry.tool) bumpTool(entry.tool, "redacted");
  } else if (entry.kind === "protocol" || entry.kind === "error") {
    c.protocolError = (c.protocolError || 0) + 1;
  }
}

const es = new EventSource("/events");
es.addEventListener("snapshot", e => {
  try { state = JSON.parse(e.data); } catch (_) {}
  render();
});
es.addEventListener("entry", e => {
  try { applyEntry(JSON.parse(e.data).data); render(); } catch (_) {}
});
es.onerror = () => {
  const live = document.querySelector(".live");
  if (live) live.style.opacity = "0.4";
};
es.onopen = () => {
  const live = document.querySelector(".live");
  if (live) live.style.opacity = "1";
};

fetch("/api/stats").then(r => r.json()).then(s => { state = s; render(); }).catch(() => {});
setInterval(() => $("uptime").textContent = fmtUptime(), 1000);
</script>
</body>
</html>
